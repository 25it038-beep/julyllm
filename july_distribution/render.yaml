# HS AI SOLUTIONS — RENDER BLUEPRINT
# July LLM Distribution Backend & Managed PostgreSQL Database
# Founder: Harshan Seliyan

services:
  - type: web
    name: july-distribution-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r july_distribution/requirements.txt"
    startCommand: "uvicorn july_distribution.server.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: july-postgres
          property: connectionString
      - key: JULY_R2_ENDPOINT
        value: "https://21e5f9f23e1d60cb56bf1200e89255f3.r2.cloudflarestorage.com/"
      - key: JULY_R2_BUCKET
        value: "july"
      - key: JULY_R2_OBJECT
        value: "july-final.gguf"
      - key: ALLOWED_ORIGINS
        value: "*"
      # Sensitive credentials must be populated in the Render Dashboard:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: july-postgres
    plan: free
    region: oregon
    databaseName: july_distribution
    user: july_admin
