services:
  - type: web
    name: july-cloud-inference
    runtime: docker
    plan: standard # Recommended: standard (2GB RAM) or pro (4GB RAM) for 3B GGUF
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    # Render Persistent Disk: Preserves GGUF across deploys & restarts
    disk:
      name: july-models
      mountPath: /models
      sizeGB: 10

    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: MODELS_DIR
        value: /models
      - key: MODEL_REPO
        sync: false # Set in Render Dashboard: e.g., your-username/Gravity_HS
      - key: MODEL_FILENAME
        value: Gravity_HS.gguf
      - key: MODEL_PATH
        value: /models/Gravity_HS.gguf
      - key: HF_TOKEN
        sync: false # Secret: Hugging Face read access token (hf_...)
      - key: API_KEY
        generateValue: true # Securely generated by Render or custom
      - key: ADMIN_KEY
        generateValue: true # Securely generated by Render for admin endpoints
      - key: N_THREADS
        value: "2" # Optimized for Render CPU allocation
      - key: N_CTX
        value: "2048" # Balance between context window and RAM headroom
      - key: N_BATCH
        value: "512"
      - key: RATE_LIMIT_RPM
        value: "60"
      - key: MOCK_INFERENCE
        value: "false"
